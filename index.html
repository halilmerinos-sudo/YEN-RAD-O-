<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Radyo Dinle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            border: 1px solid #333;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 { color: #2075D7; margin-bottom: 4px; font-size: 20px; }
        .status { font-size: 13px; color: #aaa; margin-bottom: 15px; min-height: 18px; }
        
        .search-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
            font-size: 14px;
        }
        .search-box:focus { border-color: #2075D7; }

        .radio-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .radio-list::-webkit-scrollbar { width: 6px; }
        .radio-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .radio-list::-webkit-scrollbar-thumb:hover { background: #2075D7; }
        
        .radio-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #383838;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .radio-btn:hover { background: #333; border-color: #2075D7; }
        .radio-btn.active { background: #2075D7; color: #fff; border-color: #2075D7; }
        .radio-btn small { font-size: 11px; opacity: 0.7; font-weight: normal; }

        audio { width: 100%; margin-top: 10px; outline: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="currentRadio">Radyo Seçin</h2>
    <div class="status" id="statusText">Listeden dinlemek istediğiniz kanala tıklayın</div>

    <input type="text" id="searchInput" class="search-box" placeholder="Radyo ara..." onkeyup="radyoAra()">

    <div class="radio-list" id="radioContainer">
        <!-- JS ile dinamik doldurulacak -->
    </div>

    <audio id="audioPlayer" controls></audio>
</div>

        { name: "Radyo Mydonose", freq: "Hit", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/MYDONOSE128AAC.aac" },

        // 6. Satır
        { name: "CNN Türk Radyo", freq: "Haber", url: "https://radyo.dekortv.com/cnnturk/stream" },
        { name: "Habertürk Radyo", freq: "90.4", url: "https://stream.haberturk.com/radyo/stream" },
        { name: "TGRT FM", freq: "Haber/Sohbet", url: "https://shoutcast.radyotvonline.net/tgrtfm" },
        { name: "Radyospor", freq: "107.2", url: "https://stream.radyospor.com/radyospor/stream" },
        { name: "İstanbul'un Sesi", freq: "91.8", url: "https://shoutcast.radyotvonline.net/istanbulunsesi" },
        { name: "Polis Radyosu", freq: "Karma", url: "https://yayin.polisradyosu.pol.tr:8000/stream" },
        { name: "Diyanet Radyo", freq: "Dini", url: "https://diyanet.radyotvonline.net/diyanetfmaudio" },
        { name: "Bayram FM", freq: "Dini", url: "https://shoutcast.radyotvonline.net/bayramfm" }
    ];

    const container = document.getElementById('radioContainer');
    const player = document.getElementById('audioPlayer');
    const statusText = document.getElementById('statusText');
    const currentRadioTitle = document.getElementById('currentRadio');

    // Listeyi Ekrana Bas
    function listeyiOlustur(data) {
        container.innerHTML = '';
        data.forEach((radyo) => {
            const btn = document.createElement('button');
            btn.className = 'radio-btn';
            btn.onclick = () => radyoCal(radyo.name, radyo.url, btn);
            btn.innerHTML = `<span>📻 ${radyo.name}</span> <small>${radyo.freq}</small>`;
            container.appendChild(btn);
        });
    }

    // Oynatma Fonksiyonu
    function radyoCal(radyoAdi, streamUrl, btnElement) {
        document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        currentRadioTitle.innerText = radyoAdi;
        statusText.innerText = "⏳ Yayın yükleniyor...";

        player.src = streamUrl;
        player.load();
        
        player.play().then(() => {
            statusText.innerText = "▶ Canlı Yayın Başladı";
        }).catch(() => {
            statusText.innerText = "⚠️ Oynatma engellendi. Aşağıdaki 'Play' (▶) butonuna basın.";
        });
    }

    // Arama Fonksiyonu
    function radyoAra() {
        const text = document.getElementById('searchInput').value.toLowerCase();
        const filtrelenmis = radyolar.filter(r => r.name.toLowerCase().includes(text) || r.freq.toLowerCase().includes(text));
        listeyiOlustur(filtrelenmis);
    }

    // Sayfa yüklenince başlat
    listeyiOlustur(radyolar);
</script>

</body>
</html>
